<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio CharlyRose</title>
    <!-- CSS propio -->
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>


<body>

<!-- Barra de navegación -->
<header class="header">
    <!-- Logo -->
    <div id="logo">
        <img src="imagenes/5Recurso 1.png" alt="Logo">
    </div>
    <!-- Menú + buscador -->
  <navbar class="menu-container">
        <!-- Menú -->
        <ul class="menu">
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Tienda</a></li>
            <li><a href="#">Contacto</a></li>
            <li><a href="#">Sobre nosotros</a></li>
        </ul>
        <!-- Buscador -->
      <input type="text" placeholder="Buscar..." class="search">
    </navbar>
</header>


<!-- Carrusel -->
<section class="carousel">
  <div class="slides">

    <!-- Imagen 1 -->
    <div class="slide">
      <img src="imagenes/1.png" alt="">
      <div class="texto">
        <h2>Elegancia que enamora</h2>
        <p>Nueva colección disponible</p>
        <button>Comprar ahora</button>
      </div>
    </div>

    <!-- Imagen 2 -->
    <div class="slide">
      <img src="imagenes/2.png" alt="">
      <div class="texto">
        <button>Ver más</button>
      </div>
    </div>

    <!-- Imagen 3 -->
    <div class="slide">
      <img src="imagenes/3.png" alt="">
      <div class="texto">
        <h2>Moda que inspira</h2>
        <p>Descubre tu estilo</p>
        <button>Explorar</button>
      </div>
    </div>

    <!-- Imagen 4 -->
    <div class="slide">
      <img src="imagenes/4.png" alt="">
      <div class="texto">
        <h2>Brilla con confianza</h2>
        <p>Resalta tu belleza</p>
        <button>Comprar</button>
      </div>
    </div>

  </div>
</section>

<!-- Texto de prueba -->
<div class="content">
  <p>Lorem ipsum dolor sit amet...</p>
  <p>Lorem ipsum dolor sit amet...</p>
</div>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
